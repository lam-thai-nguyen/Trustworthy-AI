<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="780" viewBox="0 0 1800 780" role="img" aria-labelledby="desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <desc id="desc">Five-stage fairness audit: prepare data, compare models, identify proxy features, ablate proxies, and apply fairness constraints before common held-out evaluation.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #243b53; }
      .stage { font-size: 27px; font-weight: 700; }
      .body { font-size: 23px; font-weight: 400; }
      .strong { font-size: 23px; font-weight: 700; }
      .box { fill: #f7f9fb; stroke: #9fb3c8; stroke-width: 2.5; }
      .focus { fill: #eef4f7; stroke: #527b8c; stroke-width: 2.5; }
      .result { fill: #f4f1ea; stroke: #a18f6a; stroke-width: 2.5; }
      .divider { stroke: #d9e2ec; stroke-width: 2; }
      .connector { stroke: #637381; stroke-width: 4; fill: none; stroke-linecap: butt; stroke-linejoin: miter; }
      .icon { stroke: #527b8c; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon-muted { stroke: #637381; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" refX="0" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#637381"/>
    </marker>
  </defs>

  <rect width="1800" height="780" fill="#ffffff"/>

  <rect x="70" y="70" width="285" height="350" rx="14" class="box"/>
  <text x="212" y="113" text-anchor="middle" class="stage">1  Prepare data</text>
  <g transform="translate(167 145)" class="icon"><path d="M0 17h90M0 43h90M0 69h90"/><path d="M14 3v82M42 3v82M70 3v82"/><rect x="0" y="3" width="90" height="82" rx="4"/></g>
  <text x="212" y="275" text-anchor="middle" class="strong">Adult dataset</text>
  <text x="212" y="310" text-anchor="middle" class="body">clean + encode</text>
  <text x="212" y="345" text-anchor="middle" class="body">train / test split</text>
  <line x1="125" y1="370" x2="300" y2="370" class="divider"/>
  <text x="212" y="400" text-anchor="middle" class="body">retain sex for audit</text>

  <rect x="405" y="70" width="285" height="350" rx="14" class="box"/>
  <text x="547" y="113" text-anchor="middle" class="stage">2  Compare models</text>
  <g transform="translate(500 145)" class="icon-muted"><rect x="0" y="28" width="26" height="60" rx="3"/><rect x="40" y="10" width="26" height="78" rx="3"/><rect x="80" y="40" width="26" height="48" rx="3"/><path d="M0 98h106"/></g>
  <text x="547" y="275" text-anchor="middle" class="strong">XGBoost</text>
  <text x="547" y="310" text-anchor="middle" class="body">with sex</text>
  <text x="547" y="345" text-anchor="middle" class="body">without sex</text>
  <line x1="460" y1="370" x2="635" y2="370" class="divider"/>
  <text x="547" y="400" text-anchor="middle" class="body">same split + rule</text>

  <rect x="740" y="70" width="285" height="350" rx="14" class="focus"/>
  <text x="882" y="113" text-anchor="middle" class="stage">3  Find proxies</text>
  <g transform="translate(820 145)" class="icon"><circle cx="44" cy="42" r="30"/><path d="M66 64l25 25"/><path d="M27 44l12 12 23-28"/></g>
  <text x="882" y="275" text-anchor="middle" class="strong">TreeSHAP ranking</text>
  <text x="882" y="310" text-anchor="middle" class="body">subgroup comparison</text>
  <line x1="795" y1="335" x2="970" y2="335" class="divider"/>
  <text x="882" y="370" text-anchor="middle" class="body">relationship</text>
  <text x="882" y="400" text-anchor="middle" class="body">marital-status · occupation</text>

  <rect x="1075" y="70" width="285" height="350" rx="14" class="box"/>
  <text x="1217" y="113" text-anchor="middle" class="stage">4  Ablate proxies</text>
  <g transform="translate(1166.5 148)" class="icon-muted"><path d="M12 19h78M22 19v65h58V19M34 7h34l7 12H27z"/><path d="M39 35v34M63 35v34M4 91h94"/></g>
  <text x="1217" y="275" text-anchor="middle" class="strong">retrain variants</text>
  <text x="1217" y="310" text-anchor="middle" class="body">one feature / set</text>
  <line x1="1130" y1="335" x2="1305" y2="335" class="divider"/>
  <text x="1217" y="370" text-anchor="middle" class="body">performance</text>
  <text x="1217" y="400" text-anchor="middle" class="body">fairness · explanations</text>

  <rect x="1410" y="70" width="285" height="350" rx="14" class="focus"/>
  <text x="1552" y="113" text-anchor="middle" class="stage">5  Constrain learning</text>
  <g transform="translate(1492 145)" class="icon"><path d="M60 9v75M22 34h76M22 68h76"/><circle cx="60" cy="34" r="8" fill="#527b8c"/><circle cx="36" cy="68" r="8" fill="#527b8c"/><circle cx="84" cy="68" r="8" fill="#527b8c"/><path d="M60 42v14M44 68h-8M76 68h8"/></g>
  <text x="1552" y="275" text-anchor="middle" class="strong">Fairlearn</text>
  <text x="1552" y="310" text-anchor="middle" class="body">demographic parity</text>
  <text x="1552" y="345" text-anchor="middle" class="body">equalized odds</text>
  <line x1="1450" y1="370" x2="1625" y2="370" class="divider"/>
  <text x="1552" y="400" text-anchor="middle" class="body">constraint variable: sex</text>

  <!-- stage arrows: tip lands exactly on next box edge -->
  <line x1="355" y1="245" x2="391" y2="245" class="connector" marker-end="url(#arrow)"/>
  <line x1="690" y1="245" x2="726" y2="245" class="connector" marker-end="url(#arrow)"/>
  <line x1="1025" y1="245" x2="1061" y2="245" class="connector" marker-end="url(#arrow)"/>
  <line x1="1360" y1="245" x2="1396" y2="245" class="connector" marker-end="url(#arrow)"/>

  <rect x="227.5" y="570" width="1310" height="185" rx="14" class="result"/>
  <text x="882.5" y="610" text-anchor="middle" class="stage">Common held-out evaluation</text>
  <text x="882.5" y="648" text-anchor="middle" class="strong">predictive performance</text>
  <text x="882.5" y="675" text-anchor="middle" class="body">accuracy · balanced accuracy · precision · recall · F1</text>
  <text x="882.5" y="704" text-anchor="middle" class="strong">group fairness</text>
  <text x="882.5" y="735" text-anchor="middle" class="body">demographic parity difference · equalized odds difference</text>

  <!-- bus: outer path has clean mitered corners -->
  <path d="M212 420V492H1552V420" class="connector"/>
  <path d="M547 420V492M882 420V492M1217 420V492" class="connector"/>
  <line x1="882.5" y1="492" x2="882.5" y2="556" class="connector" marker-end="url(#arrow)"/>
</svg>
